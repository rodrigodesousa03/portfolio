<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferramentas | Rodrigo de Sousa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <style>
    /* ---- Page Header ---- */
    .tools-page-hero {
      padding-top: 110px;
      padding-bottom: 0.5rem;
    }
    .tools-page-hero .page-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0.5rem 0 0.75rem;
    }
    .tools-page-hero .page-subtitle {
      color: var(--text-dim);
      font-size: 1.05rem;
    }

    /* ---- Tool Menu Cards ---- */
    .tools-catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .tool-menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      position: relative;
      overflow: hidden;
    }
    .tool-menu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .tool-menu-card:hover,
    .tool-menu-card.active {
      border-color: var(--cyan);
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.15);
      transform: translateY(-4px);
    }
    .tool-menu-card:hover::before,
    .tool-menu-card.active::before { opacity: 1; }
    .tool-menu-icon { font-size: 2rem; line-height: 1; }
    .tool-menu-card h3 {
      font-family: var(--font-head);
      font-size: 0.9rem;
      color: var(--text);
      margin: 0;
    }
    .tool-menu-card p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin: 0;
      line-height: 1.5;
    }
    .tool-menu-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .tool-menu-tags span {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      background: rgba(0, 245, 255, 0.08);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 4px;
      color: var(--cyan);
      font-family: var(--font-mono);
    }

    /* ---- Template Selector ---- */
    .template-selector-section {
      margin-bottom: 1.75rem;
    }
    .template-section-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }
    .template-selector-row {
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }
    .template-selector-row .setup-select { flex: 1; }
    .btn-template-action {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      padding: 0.38rem 0.8rem;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: var(--font-main);
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-template-action:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-template-delete {
      background: none;
      border: 1px solid rgba(255, 90, 90, 0.3);
      border-radius: 6px;
      color: rgba(255, 90, 90, 0.6);
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-template-delete:hover { border-color: #ff5a5a; color: #ff5a5a; background: rgba(255,90,90,0.06); }

    /* ---- Launch Panel ---- */
    .tool-launch-panel { max-width: 460px; margin: 0 auto; padding: 1rem 0 2rem; }
    .tool-launch-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .tool-launch-icon { font-size: 2.2rem; }
    .tool-launch-name {
      font-family: var(--font-head);
      font-size: 1.1rem;
      color: var(--text);
    }
    .tool-launch-meta {
      color: var(--text-dim);
      font-size: 0.78rem;
      font-family: var(--font-mono);
      margin-top: 0.2rem;
    }
    .tool-launch-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 480px) { .tool-launch-actions { grid-template-columns: 1fr; } }
    .tool-launch-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem 1.1rem;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .tool-launch-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      opacity: 0;
      transition: opacity 0.25s;
    }
    .tool-launch-btn:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,245,255,0.12); transform: translateY(-3px); }
    .tool-launch-btn:hover::before { opacity: 1; }
    .launch-btn-icon {
      font-size: 1.4rem;
      color: var(--cyan);
      font-family: var(--font-head);
      flex-shrink: 0;
      width: 1.8rem;
      text-align: center;
    }
    .launch-btn-title {
      font-family: var(--font-head);
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .launch-btn-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; }

    /* ---- Setup Name Input ---- */
    .setup-name-input {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--cyan);
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      outline: none;
      padding: 0.1rem 0 0.25rem;
      width: 100%;
      max-width: 420px;
      transition: border-color 0.2s;
      display: block;
      margin-bottom: 0.35rem;
    }
    .setup-name-input:focus { border-bottom-color: var(--cyan); }
    .setup-name-input::placeholder { color: var(--text-dim); opacity: 0.45; font-weight: 400; }
    .setup-header-inputs {
      display: flex;
      gap: 1.25rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .setup-track-input {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      outline: none;
      padding: 0.1rem 0 0.25rem;
      width: 180px;
      transition: border-color 0.2s, color 0.2s;
      display: block;
      margin-bottom: 0.35rem;
    }
    .setup-track-input:focus { border-bottom-color: var(--cyan); color: var(--text); }
    .setup-track-input::placeholder { color: var(--text-dim); opacity: 0.35; }
    @media (max-width: 520px) {
      .setup-header-inputs { flex-direction: column; gap: 0.5rem; }
      .setup-track-input { width: 100%; }
    }

    /* ---- Tool Workspace ---- */
    #tool-workspace { display: none; }
    .tool-workspace-header { margin-bottom: 2rem; }
    .tool-workspace-title {
      font-family: var(--font-head);
      font-size: 1.3rem;
      color: var(--cyan);
    }
    .tool-workspace-meta {
      color: var(--text-dim);
      font-size: 0.8rem;
      font-family: var(--font-mono);
      margin-top: 0.2rem;
    }

    /* ---- Category Tabs ---- */
    .category-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--cyan) transparent;
    }
    .cat-tab {
      flex-shrink: 0;
      padding: 0.45rem 1rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font-main);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .cat-tab:hover { border-color: var(--cyan); color: var(--cyan); }
    .cat-tab.active {
      background: rgba(0, 245, 255, 0.1);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* ---- Category Panels ---- */
    .cat-panel { display: none; }
    .cat-panel.active { display: block; }

    /* ---- Subcategory ---- */
    .subcat-block { margin-bottom: 2rem; }
    .subcat-title {
      font-family: var(--font-head);
      font-size: 0.7rem;
      color: var(--cyan);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem 2.5rem;
    }
    @media (max-width: 640px) {
      .fields-grid { grid-template-columns: 1fr; }
    }

    /* ---- Field Row ---- */
    .field-row { display: flex; flex-direction: column; gap: 0.3rem; }
    .field-header { display: flex; justify-content: space-between; align-items: baseline; }
    .field-label {
      font-size: 0.76rem;
      color: var(--text-dim);
      font-family: var(--font-main);
      font-weight: 500;
    }
    .field-value {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--cyan);
      min-width: 4.5rem;
      text-align: right;
    }

    /* ---- Slider ---- */
    input[type="range"].setup-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].setup-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px rgba(0, 245, 255, 0.7);
      cursor: pointer;
      transition: transform 0.15s;
    }
    input[type="range"].setup-slider::-webkit-slider-thumb:hover { transform: scale(1.35); }
    input[type="range"].setup-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px rgba(0, 245, 255, 0.7);
      cursor: pointer;
      border: none;
    }
    .field-row.field-fixed input[type="range"] { opacity: 0.35; pointer-events: none; }
    .field-row.field-fixed .field-label::after { content: ' (fixo)'; font-size: 0.65rem; opacity: 0.5; }

    /* ---- Select ---- */
    select.setup-select {
      width: 100%;
      padding: 0.38rem 0.75rem;
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    select.setup-select:focus { border-color: var(--cyan); }

    /* ---- Sides (L/R independent sliders) ---- */
    .sides-row { display: flex; align-items: center; gap: 0.5rem; }
    .side-col { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; min-width: 0; }
    .side-top { display: flex; align-items: baseline; gap: 0.3rem; }
    .side-label {
      font-size: 0.62rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      width: 1.6rem;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .field-link-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.1rem 0.15rem;
      border-radius: 3px;
      opacity: 0.35;
      transition: color 0.2s, opacity 0.2s;
      line-height: 1;
      flex-shrink: 0;
      align-self: center;
    }
    .field-link-btn:hover { opacity: 1; }
    .field-link-btn.linked { color: var(--cyan); opacity: 0.85; }

    /* ---- Field Controls (value + cfg button) ---- */
    .field-controls { display: flex; align-items: center; gap: 0.35rem; }
    .field-cfg-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.05rem 0.15rem;
      border-radius: 3px;
      opacity: 0.4;
      transition: color 0.2s, opacity 0.2s;
      line-height: 1;
    }
    .field-cfg-btn:hover { color: var(--cyan); opacity: 1; }
    .field-row.cfg-open .field-cfg-btn { color: var(--cyan); opacity: 1; }
    .field-info-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.05rem 0.15rem;
      border-radius: 3px;
      opacity: 0.4;
      transition: color 0.2s, opacity 0.2s;
      line-height: 1;
      font-style: italic;
      font-weight: 700;
    }
    .field-info-btn:hover { color: #ffc03d; opacity: 1; }
    .field-row.info-open .field-info-btn { color: #ffc03d; opacity: 1; }

    /* ---- Field Info Panel ---- */
    .field-info {
      display: none;
      margin-top: 0.45rem;
      padding: 0.5rem 0.7rem;
      background: rgba(255, 192, 61, 0.04);
      border: 1px solid rgba(255, 192, 61, 0.18);
      border-radius: 6px;
    }
    .field-row.info-open .field-info { display: block; }
    .field-info-desc {
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin: 0 0 0.4rem;
    }
    .field-info-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.1rem; }
    .field-info-effects { margin-top: 0.5rem; }
    .field-info-fx-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .field-info-fx-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .field-info-fx-default {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-left: auto;
      opacity: 0.65;
    }
    .field-info-fx-list {
      margin: 0;
      padding-left: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }
    .field-info-fx-list li { font-size: 0.75rem; color: var(--text); line-height: 1.4; }
    .field-info-tag {
      font-size: 0.6rem;
      padding: 0.08rem 0.38rem;
      background: rgba(255, 192, 61, 0.08);
      border: 1px solid rgba(255, 192, 61, 0.2);
      border-radius: 3px;
      color: #ffc03d;
      font-family: var(--font-mono);
      opacity: 0.8;
    }

    /* ---- Field Config Panel ---- */
    .field-config {
      display: none;
      margin-top: 0.5rem;
      padding: 0.55rem 0.7rem;
      background: rgba(0, 245, 255, 0.04);
      border: 1px solid rgba(0, 245, 255, 0.12);
      border-radius: 6px;
    }
    .field-row.cfg-open .field-config { display: block; }

    .cfg-inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    .cfg-inputs-select { grid-template-columns: 1fr; max-width: 130px; }
    @media (max-width: 480px) { .cfg-inputs { grid-template-columns: repeat(2, 1fr); } }

    .cfg-label-input { display: flex; flex-direction: column; gap: 0.2rem; }
    .cfg-label {
      font-size: 0.62rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }
    .cfg-input {
      width: 100%;
      padding: 0.22rem 0.4rem;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .cfg-input:focus { border-color: var(--cyan); }
    .cfg-input::-webkit-outer-spin-button,
    .cfg-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    select.cfg-input { background: var(--dark); cursor: pointer; }

    /* ---- Adjustable toggle ---- */
    .cfg-adjustable-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.55rem;
      cursor: pointer;
      user-select: none;
    }
    .cfg-adjustable-check { display: none; }
    .cfg-toggle-track {
      width: 28px;
      height: 15px;
      background: var(--border);
      border-radius: 8px;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .cfg-toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: transform 0.2s, background 0.2s;
    }
    .cfg-adjustable-check:checked + .cfg-toggle-track { background: rgba(0, 245, 255, 0.35); }
    .cfg-adjustable-check:checked + .cfg-toggle-track .cfg-toggle-thumb {
      transform: translateX(13px);
      background: var(--cyan);
    }

    /* ---- Locked (non-adjustable) field ---- */
    .field-row.field-locked .setup-slider { opacity: 0.2; pointer-events: none; }
    .field-row.field-locked .field-label  { opacity: 0.45; }
    .field-row.field-locked .field-value  { opacity: 0.45; }
    .field-row.field-locked .field-value::after { content: ' 🔒'; font-size: 0.65em; }

    /* ---- Action Bar ---- */
    .setup-action-bar {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255, 90, 90, 0.4);
      color: rgba(255, 90, 90, 0.8);
      padding: 0.45rem 1.2rem;
      border-radius: 6px;
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:hover { background: rgba(255, 90, 90, 0.08); border-color: rgba(255, 90, 90, 0.9); color: #ff5a5a; }
    .btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.45rem 1.2rem;
      border-radius: 6px;
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-copy.copied { border-color: #00ff88; color: #00ff88; }

    /* ---- Analyze Button ---- */
    .btn-analyze {
      background: transparent;
      border: 1px solid rgba(0, 245, 255, 0.35);
      color: var(--cyan);
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .btn-analyze:hover { background: rgba(0, 245, 255, 0.08); border-color: var(--cyan); }
    .analyze-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.2rem;
      height: 1.2rem;
      padding: 0 0.3rem;
      background: var(--cyan);
      color: var(--dark);
      border-radius: 10px;
      font-size: 0.62rem;
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1;
    }

    /* ---- Field Diff Badge ---- */
    .field-diff-badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.05rem 0.25rem;
      border-radius: 3px;
      line-height: 1.5;
      flex-shrink: 0;
    }
    .field-diff-badge.up   { color: var(--cyan);  background: rgba(0, 245, 255, 0.1); }
    .field-diff-badge.down { color: #ffc03d;       background: rgba(255, 192, 61, 0.1); }

    /* ---- Analysis Overlay ---- */
    .analysis-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 15, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .analysis-overlay.open { opacity: 1; pointer-events: all; }
    .analysis-panel {
      width: min(460px, 100vw);
      height: 100vh;
      background: var(--dark2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      overflow: hidden;
    }
    .analysis-overlay.open .analysis-panel { transform: translateX(0); }
    .analysis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .analysis-title {
      font-family: var(--font-head);
      font-size: 0.85rem;
      color: var(--cyan);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .analysis-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 2rem;
      height: 2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .analysis-close:hover { border-color: var(--cyan); color: var(--cyan); }
    .analysis-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--cyan) transparent;
    }
    .analysis-empty {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 2rem;
    }
    .analysis-card {
      background: rgba(0, 245, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .analysis-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .analysis-field-name {
      font-family: var(--font-head);
      font-size: 0.82rem;
      color: var(--text);
    }
    .analysis-dir {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .analysis-dir.up   { color: var(--cyan); background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.2); }
    .analysis-dir.down { color: #ffc03d;      background: rgba(255, 192, 61, 0.1); border: 1px solid rgba(255, 192, 61, 0.2); }
    .analysis-values {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }
    .analysis-current { color: var(--cyan); }
    .analysis-sep { color: var(--text-dim); }
    .analysis-default { color: var(--text-dim); }
    .analysis-desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.5; margin: 0; }
    .analysis-effects {
      margin: 0.1rem 0 0 0;
      padding-left: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .analysis-effects li { font-size: 0.78rem; color: var(--text); line-height: 1.4; }
    .analysis-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .analysis-tag {
      font-size: 0.6rem;
      padding: 0.1rem 0.4rem;
      background: rgba(0, 245, 255, 0.06);
